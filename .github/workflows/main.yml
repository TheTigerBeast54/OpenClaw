name: Build Captain Claw Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - android-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build components
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
        - name: Prepare SDL Android sources
        shell: bash
          run: |
            set -euo pipefail

            DEST="android-app/app/src/main/java/org/libsdl/app"
            mkdir -p "$DEST"

            SDL_ACTIVITY="$(find ThirdParty/SDL2 -type f -name SDLActivity.java -print -quit 2>/dev/null || true)"

            if [ -z "$SDL_ACTIVITY" ]; then
              echo "SDLActivity.java not found locally; fetching SDL2 Android sources."
              git clone --depth 1 --branch SDL2 \
                https://github.com/libsdl-org/SDL.git \
                "$RUNNER_TEMP/SDL"
              SDL_ACTIVITY="$(find "$RUNNER_TEMP/SDL" -type f -name SDLActivity.java -print -quit)"
            fi

            if [ -z "$SDL_ACTIVITY" ]; then
              echo "::error::SDLActivity.java could not be located."
              exit 1
            fi

            SDL_JAVA_DIR="$(dirname "$SDL_ACTIVITY")"
            echo "Using SDL Java sources from: $SDL_JAVA_DIR"
            cp -v "$SDL_JAVA_DIR"/*.java "$DEST"/

      - name: Build debug APK
        run: gradle --no-daemon -p android-app assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: captainclaw-android-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
