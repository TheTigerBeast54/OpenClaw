name: Captain Claw Android Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Inspect repository
        shell: bash
        run: |
          echo "=== Repository root ==="
          ls -la

          echo "=== Build files ==="
          find . -maxdepth 5 -type f \( \
            -name "gradlew" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "pom.xml" -o \
            -name "CMakeLists.txt" -o \
            -name "AndroidManifest.xml" -o \
            -name "Makefile" \
          \) -print

          echo "=== Top-level directories ==="
          find . -maxdepth 2 -type d -print

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.directory }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: captainclaw-android-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
