name: Build Captain Claw Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - android-port

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

     ```yaml
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1
```

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch SDL dependencies
        run: |
          mkdir -p android-app/third_party

          git clone --depth 1 --branch release-2.30.11 \
            https://github.com/libsdl-org/SDL.git \
            android-app/third_party/SDL

          git clone --depth 1 --branch release-2.8.2 \
            https://github.com/libsdl-org/SDL_image.git \
            android-app/third_party/SDL_image

          git clone --depth 1 --branch release-2.8.0 \
            https://github.com/libsdl-org/SDL_mixer.git \
            android-app/third_party/SDL_mixer

          git clone --depth 1 --branch release-2.22.0 \
            https://github.com/libsdl-org/SDL_ttf.git \
            android-app/third_party/SDL_ttf

          git clone --depth 1 --branch release-1.0.4 \
            https://github.com/ferzkopp/SDL2_gfx.git \
            android-app/third_party/SDL2_gfx

      - name: Copy SDL Android Java sources
        run: |
          mkdir -p android-app/app/src/main/java/org/libsdl
          cp -R android-app/third_party/SDL/android-project/app/src/main/java/org/libsdl/app \
            android-app/app/src/main/java/org/libsdl/

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: captainclaw-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
