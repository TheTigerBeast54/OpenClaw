name: Captain Claw Android Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android-app/gradlew" ]; then
            echo "directory=android-app" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle wrapper not found."
            find . -maxdepth 4 -name gradlew -type f
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.directory }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: captainclaw-android-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
